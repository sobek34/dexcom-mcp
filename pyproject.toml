[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dexcom-mcp"
version = "0.1.0"
description = "Dexcom CGM MCP server for Claude Desktop"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
dexcom-mcp = "server:run"

[tool.setuptools]
py-modules = ["server"]
